name: CI

# Körs på varje push (alla grenar, alltså även PR-grenar) och kan startas manuellt.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploya till staging efter gröna kontroller
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typer och enhetstester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sök efter hemligheter i klientkod
        run: pnpm check:secrets
      - name: Formatering
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typkontroll
        run: pnpm typecheck
      - name: Enhetstester
        run: pnpm test

  database:
    name: Databas – migreringar, RLS-tester och integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Starta lokal Supabase (endast det som behövs)
        run: >
          pnpm exec supabase start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Applicera alla migreringar från tom databas
        run: pnpm exec supabase db reset
      - name: Databaslint (plpgsql_check)
        run: pnpm exec supabase db lint --schema public,private --level warning --fail-on warning
      - name: pgTAP – RLS-matris, RPC-flöden och metatester
        run: pnpm exec supabase test db
      - name: Genererade typer i synk med migreringarna
        run: pnpm check:types-drift
      - name: Integrationstest för auth mot lokal Supabase
        run: |
          export SUPABASE_PUBLISHABLE_KEY=$(pnpm exec supabase status -o json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).PUBLISHABLE_KEY))")
          pnpm --filter @famcheck/mobile test:integration
      - name: Stoppa Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Staging: deployas bara när quality OCH database är gröna, från main eller
  # manuellt. Production finns inte ännu. Se docs/architecture/STAGING.md.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Staging – migreringar, tester och säkerhetskontroller
    needs: [quality, database]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kontrollera att staging-konfigurationen finns
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then echo "Saknar $name i GitHub-miljön 'staging'"; exit 1; fi
          done
          test "$SUPABASE_PROJECT_REF" = "dawzbqjnasbkllsstcky" || { echo "Fel projekt-ref för staging"; exit 1; }
      - name: Länka stagingprojektet
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Visa migreringar som kommer att appliceras
        run: pnpm exec supabase db push --linked --dry-run
      - name: Applicera migreringar
        run: pnpm exec supabase db push --linked
      - name: Pusha auth-/API-konfiguration (config.toml + remotes.staging)
        run: pnpm exec supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Databaslint mot staging
        run: pnpm exec supabase db lint --linked --schema public,private --level warning --fail-on warning
      - name: pgTAP mot staging (RLS-matris, RPC, metatester inkl. privilegier)
        run: pnpm exec supabase test db --linked
      - name: Supabase Security Advisor
        run: node scripts/check-advisors.mjs
      - name: Integrationstest mot staging (admin-OTP, inga riktiga mejl)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$SUPABASE_SECRET_KEY" || { echo "Saknar SUPABASE_SECRET_KEY"; exit 1; }
          pnpm --filter @famcheck/mobile test:integration
      - name: Bygg appbundle för preview och sök efter hemligheter
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          (cd apps/mobile && npx expo export --platform android --platform ios --no-bytecode --output-dir "$RUNNER_TEMP/bundle")
          node scripts/check-bundle.mjs "$RUNNER_TEMP/bundle"
